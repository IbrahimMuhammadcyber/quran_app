name: tilawah
description: Tilawah — a Quran listening and reading app with prayer time features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.0

  # Audio playback (handles background audio + lock-screen controls)
  just_audio: ^0.9.36

  # State management
  provider: ^6.1.1

  # Local persistence (favorites, last played position, settings)
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3

  # Prayer times
  adhan: ^2.0.0
  path_provider: ^2.1.1
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.2
  geolocator: ^12.0.0

  # Sharing
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
