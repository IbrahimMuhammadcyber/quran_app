name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate platform folders
        run: flutter create . --platforms=android

      - name: Ensure required permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERM in \
            "android.permission.INTERNET" \
            "android.permission.POST_NOTIFICATIONS" \
            "android.permission.FOREGROUND_SERVICE" \
            "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" \
            "android.permission.WAKE_LOCK"
          do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "/<application/i\\    <uses-permission android:name=\"$PERM\" />" "$MANIFEST"
            fi
          done

      - name: Add audio_service manifest entries
        run: |
          python3 - <<'EOF'
          path = "android/app/src/main/AndroidManifest.xml"

          with open(path) as f:
              content = f.read()

          service_block = '''        <service android:name="com.ryanheise.audioservice.AudioService"
            android:foregroundServiceType="mediaPlayback"
            android:exported="true">
            <intent-filter>
                <action android:name="android.media.browse.MediaBrowserService" />
            </intent-filter>
        </service>
        <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MEDIA_BUTTON" />
            </intent-filter>
        </receiver>
    </application>'''

          if 'com.ryanheise.audioservice.AudioService' not in content:
              content = content.replace('    </application>', service_block)

          with open(path, 'w') as f:
              f.write(content)

          print("Patched AndroidManifest.xml with audio_service entries")
          EOF

      - name: Fix Kotlin version
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/' android/settings.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/' android/settings.gradle
          fi

      - name: Enable core library desugaring
        run: |
          python3 - <<'EOF'
          import re, os

          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"

          if os.path.exists(kts_path):
              path = kts_path
              compile_block = '    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }\n'
              dep_line = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n'
              dep_block = 'dependencies {\n' + dep_line + '}\n'
          else:
              path = groovy_path
              compile_block = '    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }\n'
              dep_line = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n"
              dep_block = 'dependencies {\n' + dep_line + '}\n'

          with open(path) as f:
              content = f.read()

          content = re.sub(r'(android\s*\{)', r'\1\n' + compile_block, content, count=1)

          if re.search(r'dependencies\s*\{', content):
              content = re.sub(r'(dependencies\s*\{)', r'\1\n' + dep_line, content, count=1)
          else:
              content += '\n' + dep_block

          with open(path, 'w') as f:
              f.write(content)

          print(f"Patched {path}")
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
